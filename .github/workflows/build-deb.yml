name: build-deb

# Build the /code-review plugin as an architecture-independent Debian package,
# verify its payload, install it on a clean Ubuntu runner, and attach it to a
# GitHub release for v* tags.
#
# The package installs files only: it never edits a user's DSH profile, so the
# install test checks the layout, integrity, and (when a Harness is available)
# bundle composition instead of starting a service.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      deb_revision:
        description: 'Debian revision appended to the package version, e.g. alex1'
        required: false
        type: string

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide read access; the release job tightens this to contents: write.
permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate the dispatch input
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_DEB_REVISION: ${{ github.event.inputs.deb_revision }}
        run: |
          revision="${INPUT_DEB_REVISION:-}"
          if [ -n "$revision" ] && ! printf '%s' "$revision" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+~]*$'; then
            echo "::error::deb_revision '$revision' is not a valid Debian revision; use letters, digits, '.', '+', '~' (for example 'alex1'), not the upstream version"
            exit 1
          fi

      # A release tag must name the exact version in package.json, otherwise the
      # tag would advertise a build the repository cannot reproduce.
      - name: Require a v* tag to match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}; tag v${version}"
            exit 1
          fi

      - name: Build, test, package and verify
        env:
          RESOLVED_DEB_REVISION: ${{ github.event.inputs.deb_revision }}
        run: |
          args=()
          if [ -n "${RESOLVED_DEB_REVISION:-}" ]; then args+=("DEB_REVISION=${RESOLVED_DEB_REVISION}"); fi
          make "${args[@]}"

      # The Harness loads the committed dist/ directly. A build that produces a
      # different tree means the committed output is stale.
      - name: Require the committed dist to match the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            git diff -- dist
            echo "::error::dist/ is out of date; run 'npm run build' and commit the result"
            exit 1
          fi

      - name: Show package metadata and verify the digest
        run: |
          cat build/BUILD-INFO.json
          dpkg-deb -f dist/*.deb \
            Package Version Architecture Depends Recommends \
            X-DSH-Plugin-Name X-DSH-Plugin-Version X-DSH-Plugin-Commit
          ( cd dist && sha256sum -c ./*.sha256 )

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            dist/*.deb
            dist/*.sha256
            build/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: Install on a clean runner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the verification script
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: pkg

      # Optional full end-to-end mode: set the repository variable DSH_DEB_URL
      # to a deepseek-harness .deb that matches the package's dependency. The
      # Harness deb itself depends on an apt nodejs package, which the runner
      # does not have, so it is installed with --force-depends; the launcher
      # then finds the setup-node runtime on PATH.
      - name: Install deepseek-harness (optional)
        if: vars.DSH_DEB_URL != ''
        env:
          DSH_DEB_URL: ${{ vars.DSH_DEB_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL "$DSH_DEB_URL" -o /tmp/deepseek-harness.deb
          sudo dpkg -i --force-depends /tmp/deepseek-harness.deb

      - name: Install the plugin package
        run: |
          deb="$PWD/$(ls pkg/dist/*.deb)"
          if dpkg-query -W -f='${Status}' deepseek-harness 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get install -y --no-install-recommends "$deb"
          else
            echo "::notice::deepseek-harness is not installed; installing with --force-depends"
            sudo dpkg -i --force-depends "$deb"
          fi

      - name: Verify the installed package
        run: bash scripts/ci-install-smoke.sh

      - name: Verify removal leaves no files behind
        run: |
          sudo dpkg --remove dsh-code-review
          if [ -e /usr/lib/dsh/plugins/code-review ]; then
            echo "::error::/usr/lib/dsh/plugins/code-review survived package removal"
            exit 1
          fi
          if [ -e /usr/share/doc/dsh-code-review/BUILD-INFO.json ]; then
            echo "::error::documentation survived package removal"
            exit 1
          fi

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release metadata
        uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: release

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$GITHUB_REF_NAME"
          files=(release/dist/*.deb release/dist/*.sha256)
          prerelease=()
          case "$version" in
            *-*) prerelease+=(--prerelease) ;;
          esac
          notes="$(printf 'Debian package for the /code-review plugin, version %s (%s).\n\nThe package installs the plugin package root under /usr/lib/dsh/plugins/code-review. It is architecture-independent (all) and does not modify any user profile. Enable it with:\n\n  dsh plugin --profile web add /usr/lib/dsh/plugins/code-review\n\nDepends: deepseek-harness (>= 0.2.2~rc.3).\n' "$version" "$(dpkg-deb -f release/dist/*.deb Architecture)")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --verify-tag --title "$tag" --notes "$notes" "${prerelease[@]}"
          fi
