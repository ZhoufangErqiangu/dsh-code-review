name: ci

# Fast test gate for pull requests into main.
#
# Packaging and release checks live in build-deb.yml, which runs on v* tags and
# manual dispatch. This workflow only proves the change compiles, passes the
# unit tests, and leaves the committed dist/ in sync.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The Harness loads the committed dist/ directly, so a test run that
      # changes it means the pull request forgot to commit the build output.
      - name: Require the committed dist to match the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            git diff -- dist
            echo "::error::dist/ is out of date; run 'npm run build' and commit the result"
            exit 1
          fi
